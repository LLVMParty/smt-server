name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # z3-sys' gh-release feature queries/downloads GitHub release assets while
  # building the z3 backend. Authenticated read-only requests avoid sporadic
  # 403s/rate-limit failures on CI runners, especially macOS.
  READ_ONLY_GITHUB_TOKEN: ${{ github.token }}

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-stable
      - name: Install GMP and MPFR (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev pkg-config
      - name: Install GMP and MPFR (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gmp mpfr pkg-config
          # brew's gmp/mpfr .pc files are not on the default search path.
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: qfbvsmtrs fuzz crate check
        run: cargo check --manifest-path crates/qfbvsmtrs/fuzz/Cargo.toml
      - name: Python client smoke
        run: python python/tests/test_python_client.py
      - name: Python package install smoke
        run: |
          python -m pip install ./python --target python-pkg-smoke
          python -c "import sys; sys.path.insert(0, 'python-pkg-smoke'); import smt_wire; ctx = smt_wire.Context(); assert ctx.bv_var('x', 8).width == 8"
      - name: Live server end-to-end
        run: python python/tests/test_live_server.py
      - name: C++ client CMake smoke
        shell: bash
        run: |
          cargo build -p smt-server
          cd cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --config Debug
          cd ..
          python - <<'PY'
          import os
          import pathlib
          import socket
          import subprocess
          import sys
          import time

          root = pathlib.Path.cwd()
          build_dir = root / "target" / "debug" / "build"
          z3_dirs = [
              str(path)
              for pattern in ("z3-sys-*/out/z3-*/bin", "z3-sys-*/out/z3-*/lib")
              for path in build_dir.glob(pattern)
          ]
          env = os.environ.copy()
          if z3_dirs:
              for var in ("PATH", "LD_LIBRARY_PATH", "DYLD_LIBRARY_PATH"):
                  env[var] = os.pathsep.join(z3_dirs + [env.get(var, "")])
          env["SMT_SERVER_ADDRESS"] = "127.0.0.1:9123"

          exe = root / "target" / "debug" / ("smt-server.exe" if os.name == "nt" else "smt-server")
          log_path = root / "target" / "cpp-e2e-server.log"
          with log_path.open("wb") as log:
              proc = subprocess.Popen([str(exe), "127.0.0.1:9123"], cwd=root, env=env, stdout=log, stderr=log)
              try:
                  deadline = time.time() + 10.0
                  last_error = None
                  while time.time() < deadline:
                      if proc.poll() is not None:
                          raise RuntimeError(f"smt-server exited early with {proc.returncode}")
                      try:
                          with socket.create_connection(("127.0.0.1", 9123), timeout=0.2):
                              break
                      except OSError as exc:
                          last_error = exc
                          time.sleep(0.05)
                  else:
                      raise TimeoutError(f"smt-server did not start: {last_error}")
                  subprocess.check_call(["ctest", "--test-dir", str(root / "cpp" / "build"), "--output-on-failure", "-C", "Debug"], env=env)
              except Exception:
                  log.flush()
                  try:
                      print(log_path.read_text(encoding="utf-8", errors="replace"), file=sys.stderr)
                  except OSError:
                      pass
                  raise
              finally:
                  proc.terminate()
                  try:
                      proc.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      proc.kill()
                      proc.wait(timeout=5)
          PY
